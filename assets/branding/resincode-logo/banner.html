<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0e0e0e; }

.banner {
  background:#080808;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
  overflow:hidden;
}
.banner .mark {
  flex-shrink:0;
  position:relative;
  display:flex; align-items:center; justify-content:center;
}
.banner .mark .ring { position:absolute; inset:0; border-radius:50%; border-style:solid; border-color:#C9A655; }
.banner .mark .ring::before { content:""; position:absolute; border-radius:50%; border-style:solid; border-color:rgba(201,166,85,.5); }
.banner .mark svg { fill:#C9A655; }

.banner .word small {
  display:block;
  font-family:'Jost',sans-serif;
  font-weight:600;
  color:#C9A655;
  text-transform:uppercase;
}
.banner .word strong {
  display:block;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:600;
  color:#F5F0E8;
  line-height:1;
}
.banner .word em {
  display:block;
  font-family:'Jost',sans-serif;
  font-style:normal;
  font-weight:400;
  color:#A2A2A2;
  text-transform:uppercase;
}

/* ---- 1200x240 ---- */
#banner-1200 { width:1200px; height:240px; gap:36px; }
#banner-1200 .mark { width:130px; height:130px; }
#banner-1200 .mark .ring { border-width:2px; }
#banner-1200 .mark .ring::before { inset:7px; border-width:1px; }
#banner-1200 .mark svg { width:50px; height:50px; }
#banner-1200 .word small { font-size:14px; letter-spacing:0.3em; margin-bottom:4px; }
#banner-1200 .word strong { font-size:56px; }
#banner-1200 .word em { font-size:13px; letter-spacing:0.16em; margin-top:8px; }

/* ---- 720x320 ---- */
#banner-720 { width:720px; height:320px; gap:30px; }
#banner-720 .mark { width:160px; height:160px; }
#banner-720 .mark .ring { border-width:2px; }
#banner-720 .mark .ring::before { inset:9px; border-width:1px; }
#banner-720 .mark svg { width:60px; height:60px; }
#banner-720 .word small { font-size:15px; letter-spacing:0.3em; margin-bottom:8px; }
#banner-720 .word strong { font-size:58px; }
#banner-720 .word em { font-size:13px; letter-spacing:0.16em; margin-top:10px; }
</style>
</head>
<body>

<div class="banner" id="banner-1200">
  <div class="mark">
    <div class="ring"></div>
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <path d="M478.13 32.79c-18.31-24.36-53.55-32.11-73.36-32.11-56.87 0-70.02 24.36-118.9 24.36S222.94 0 166.06 0c-19.81 0-55.05 7.75-73.36 32.11-15.66 20.85-30.66 55.75-30.66 108.94 0 74.11 33.5 130.24 47.03 178.14 12.5 44.3 15.62 76.02 27.19 111.32 6.35 19.44 13.62 44.5 24.06 61.19 8.75 14 22.53 20.4 34.19 20.4 34.44 0 46.19-52.13 51.5-83.06C255.44 393.44 251.13 336 256 336s.56 57.44 9.99 92.94C271.31 459.87 283.06 512 317.5 512c11.66 0 25.44-6.4 34.19-20.4 10.44-16.69 17.71-41.75 24.06-61.19 11.57-35.3 14.69-67.02 27.19-111.32 13.53-47.9 47.03-104.03 47.03-178.14 0-53.19-15-88.09-30.66-108.94z"/>
    </svg>
  </div>
  <div class="word">
    <small>Método</small>
    <strong>Resin Code</strong>
    <em>Dra. Jéssica Daniela</em>
  </div>
</div>

</html>
