<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0e0e0e; }

#icon {
  width:800px; height:800px;
  background:#080808;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.photo-ring {
  position:absolute;
  width:660px; height:660px;
  border-radius:50%;
  overflow:hidden;
  border:3px solid #C9A655;
  box-shadow: 0 0 0 14px #080808, 0 0 0 16px rgba(201,166,85,.35);
}
.photo-ring img {
  width:100%; height:100%;
  object-fit:cover;
  object-position:center 22%;
  display:block;
  filter:saturate(0.94) contrast(1.03);
}
.photo-ring::after {
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:linear-gradient(to top, rgba(8,8,8,.78) 0%, rgba(8,8,8,0) 42%);
}

.badge {
  position:absolute;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  z-index:2;
  text-align:center;
}
.badge .vip {
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:600;
  font-size:64px;
  color:#F5F0E8;
  line-height:1;
}
.badge .vip em { color:#E4C477; font-style:italic; }
.badge .sub {
  font-family:'Jost',sans-serif;
  font-weight:600;
  font-size:16px;
  letter-spacing:0.28em;
  color:#C9A655;
  text-transform:uppercase;
  margin-top:8px;
}
</style>
</head>
<body>

<div id="icon">
  <div class="photo-ring">
    <img src="../../images/portraits/dra-jessica-avatar.jpg">
  </div>
  <div class="badge">
    <div class="vip">Comunidade <em>VIP</em></div>
    <div class="sub">Resin Code</div>
  </div>
</div>

</body>
</html>
