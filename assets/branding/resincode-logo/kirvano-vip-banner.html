<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0e0e0e; }

.banner {
  background:#080808;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
}

.photo {
  flex-shrink:0;
  border-radius:50%;
  overflow:hidden;
  border:2px solid #C9A655;
  box-shadow:0 0 0 6px #080808, 0 0 0 8px rgba(201,166,85,.32);
  position:relative;
  z-index:1;
}
.photo img { width:100%; height:100%; object-fit:cover; object-position:center 22%; display:block; }

.eyebrow {
  font-family:'Jost',sans-serif;
  font-weight:600;
  color:#C9A655;
  text-transform:uppercase;
  display:flex;
  align-items:center;
}
.eyebrow::before { content:""; background:#C9A655; height:1px; }

h1 {
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:600;
  color:#F5F0E8;
  line-height:1.02;
}
h1 em { color:#E4C477; font-style:italic; }

.sub { font-family:'Jost',sans-serif; color:#9a9a9a; }

/* ================= 1200x240 ================= */
#b1200 { width:1200px; height:240px; padding:0 64px; gap:44px; }
#b1200 .photo { width:150px; height:150px; }
#b1200 .eyebrow { font-size:13px; letter-spacing:0.3em; gap:12px; margin-bottom:8px; }
#b1200 .eyebrow::before { width:22px; }
#b1200 h1 { font-size:48px; margin-bottom:6px; }
#b1200 .sub { font-size:15px; }

/* ================= 720x320 ================= */
#b720 { width:720px; height:320px; padding:36px 44px; flex-direction:column; text-align:center; justify-content:center; gap:16px; }
#b720 .photo { width:130px; height:130px; margin:0 auto; }
#b720 .eyebrow { font-size:12.5px; letter-spacing:0.3em; gap:10px; margin-bottom:6px; justify-content:center; }
#b720 .eyebrow::before { width:18px; }
#b720 h1 { font-size:40px; }
#b720 .sub { font-size:14px; }
</style>
</head>
<body>

<div class="banner" id="b1200">
  <div class="photo"><img src="../../images/portraits/dra-jessica-avatar.jpg"></div>
  <div>
    <div class="eyebrow">Método Resin Code</div>
    <h1>Comunidade <em>VIP</em> no WhatsApp</h1>
    <div class="sub">Direto com a Dra. Jéssica Daniela — dúvidas, casos e novidades do método.</div>
  </div>
</div>

<div class="banner" id="b720">
  <div class="photo"><img src="../../images/portraits/dra-jessica-avatar.jpg"></div>
  <div class="eyebrow">Método Resin Code</div>
  <h1>Comunidade <em>VIP</em> no WhatsApp</h1>
  <div class="sub">Direto com a Dra. Jéssica Daniela</div>
</div>

</body>
</html>
