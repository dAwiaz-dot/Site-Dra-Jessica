<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body { background:transparent; }

.tooth {
  width:1em; height:1em;
  display:block;
}

/* ---------- EMBLEM (icon only) ---------- */
.emblem {
  width:480px; height:480px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
}
.emblem .ring {
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px solid #C9A655;
}
.emblem .ring::before {
  content:"";
  position:absolute;
  inset:14px;
  border-radius:50%;
  border:1px solid rgba(201,166,85,.5);
}
.emblem svg.tooth-icon { width:150px; height:150px; fill:#C9A655; }
.emblem .code-mark {
  position:absolute;
  bottom:96px;
  font-family:'Jost',sans-serif;
  font-size:22px;
  font-weight:700;
  letter-spacing:0.14em;
  color:#C9A655;
}

/* ---------- HORIZONTAL LOCKUP ---------- */
.lockup {
  display:inline-flex;
  align-items:center;
  gap:34px;
  padding:70px 90px;
  background:#080808;
}
.lockup .mark {
  width:150px; height:150px;
  position:relative;
  flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.lockup .mark .ring { position:absolute; inset:0; border-radius:50%; border:2px solid #C9A655; }
.lockup .mark .ring::before { content:""; position:absolute; inset:8px; border-radius:50%; border:1px solid rgba(201,166,85,.5); }
.lockup .mark svg.tooth-icon { width:56px; height:56px; fill:#C9A655; }

.lockup .word small {
  display:block;
  font-family:'Jost',sans-serif;
  font-size:19px;
  font-weight:600;
  letter-spacing:0.32em;
  color:#C9A655;
  margin-bottom:6px;
}
.lockup .word strong {
  display:block;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:600;
  font-size:78px;
  line-height:1;
  color:#F5F0E8;
}
.lockup .word em {
  display:block;
  font-family:'Jost',sans-serif;
  font-style:normal;
  font-weight:400;
  font-size:16px;
  letter-spacing:0.18em;
  color:#A2A2A2;
  margin-top:12px;
  text-transform:uppercase;
}

/* ---------- WHITE BG VERSION ---------- */
.lockup.light { background:#FBF9F5; }
.lockup.light .word strong { color:#1A1A1A; }
.lockup.light .word em { color:#6b6b6b; }
</style>
</head>
<body>

<div class="emblem" id="emblem">
  <div class="ring"></div>
